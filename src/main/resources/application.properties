spring.application.name=ebank-cqrs-es
server.port=8085

# Base PostgreSQL (lancée par docker-compose, port hôte 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/ebank_cqrs_db
spring.datasource.username=admin
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sérialisation des commandes / événements / requêtes en JSON (Jackson)
axon.serializer.general=jackson
axon.serializer.events=jackson
axon.serializer.messages=jackson
spring.jackson.serialization.fail-on-empty-beans=false
