<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Bank CQRS</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f9; color: #1f2933; }
        header { background: #1e3a5f; color: #fff; padding: 14px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header small { opacity: .8; }
        main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
        section { background: #fff; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        h2 { font-size: 15px; margin: 0 0 10px; color: #1e3a5f; }
        input, select, button { font: inherit; padding: 6px 8px; margin: 2px 0; }
        button { background: #1e3a5f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #e4e7eb; }
        tr.sel { background: #e8f0fb; }
        .CREDIT { color: #157f3b; font-weight: 600; }
        .DEBIT { color: #b42318; font-weight: 600; }
        .new { animation: flash 1.5s; }
        @keyframes flash { from { background: #fff3c4; } to { background: transparent; } }
        #msg { min-height: 18px; font-size: 13px; color: #b42318; }
        .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9aa5b1; margin-right: 6px; }
        .live.on { background: #22c55e; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }
    </style>
</head>
<body>
<header>
    <h1>E-Bank — CQRS &amp; Event Sourcing</h1>
    <small>Axon Framework · commandes via CommandGateway · lecture via QueryGateway · temps réel via SSE</small>
</header>
<main>
    <section>
        <h2>Nouveau compte</h2>
        <input id="balance" type="number" value="5000" style="width:110px">
        <input id="currency" value="MAD" style="width:70px">
        <button onclick="addAccount()">Créer</button>
        <h2 style="margin-top:16px">Comptes (base de lecture)</h2>
        <table>
            <thead><tr><th>Id</th><th>Solde</th><th>Devise</th><th>Statut</th></tr></thead>
            <tbody id="accounts"></tbody>
        </table>
    </section>
    <section>
        <h2><span id="live" class="live"></span>Compte suivi : <code id="current">—</code></h2>
        <input id="amount" type="number" value="1000" style="width:110px">
        <button onclick="operation('credit')">Créditer</button>
        <button onclick="operation('debit')">Débiter</button>
        <select id="status">
            <option>ACTIVATED</option><option>SUSPENDED</option><option>BLOCKED</option>
        </select>
        <button onclick="updateStatus()">Changer statut</button>
        <div id="msg"></div>
        <h2>Opérations en temps réel</h2>
        <table>
            <thead><tr><th>#</th><th>Date</th><th>Type</th><th>Montant</th></tr></thead>
            <tbody id="ops"></tbody>
        </table>
    </section>
</main>
<script>
    let current = null, source = null;
    const $ = id => document.getElementById(id);

    async function call(method, url, body) {
        const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined });
        const text = await r.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; } // /add renvoie l'id en texte brut
        if (!r.ok) throw new Error((data && data.error) || text);
        return data;
    }
    const show = e => { $('msg').textContent = e ? e.message : ''; };

    async function loadAccounts() {
        const accounts = await call('GET', '/query/accounts/all');
        $('accounts').innerHTML = accounts.map(a =>
            `<tr class="${a.id === current ? 'sel' : ''}" style="cursor:pointer" onclick="watch('${a.id}')">
             <td><code>${a.id.slice(0, 8)}</code></td><td>${a.balance.toFixed(2)}</td>
             <td>${a.currency}</td><td>${a.status}</td></tr>`).join('');
    }

    async function addAccount() {
        try {
            const id = await call('POST', '/commands/accounts/add',
                { initialBalance: +$('balance').value, currency: $('currency').value });
            show(); setTimeout(async () => { await loadAccounts(); watch(id); }, 400);
        } catch (e) { show(e); }
    }

    async function operation(type) {
        if (!current) return;
        try {
            await call('POST', '/commands/accounts/' + type,
                { accountId: current, amount: +$('amount').value, currency: $('currency').value });
            show(); setTimeout(loadAccounts, 400);
        } catch (e) { show(e); }
    }

    async function updateStatus() {
        if (!current) return;
        try {
            await call('PUT', '/commands/accounts/updateStatus', { accountId: current, status: $('status').value });
            show(); setTimeout(loadAccounts, 400);
        } catch (e) { show(e); }
    }

    function watch(id) {
        current = id; $('current').textContent = id; $('ops').innerHTML = '';
        if (source) source.close();
        source = new EventSource(`/query/accounts/${id}/watch`);
        source.onopen = () => $('live').classList.add('on');
        source.onerror = () => $('live').classList.remove('on');
        source.onmessage = ev => {
            const op = JSON.parse(ev.data);
            $('ops').insertAdjacentHTML('afterbegin',
                `<tr class="new"><td>${op.id}</td><td>${new Date(op.date).toLocaleString('fr-FR')}</td>
                 <td class="${op.type}">${op.type}</td><td>${op.amount.toFixed(2)} ${op.currency}</td></tr>`);
        };
        loadAccounts();
    }

    loadAccounts().catch(show);
</script>
</body>
</html>
